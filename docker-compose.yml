version: "3.3"
services: 
  pawpal-next:
    container_name: pawpal-next
    restart: always
    image: node:24.19.0
    ports:
      - 4000:3000
    environment:
      - PORT=3000



    volumes: 
      - ./:/usr/src/pawpal-next
    working_dir: /usr/src/pawpal-next

    networks:
      - client_network

# For production
    command: bash -c "yarn && yarn run build && yarn run start"


networks:
  client_network:
    driver: bridge












# pawpal-next localhost:4000 < => container:3000
# pawpal-api localhost:4001 < => container:3007
# pawpal-batch localhost:4002 < => container:3008